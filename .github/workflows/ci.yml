name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django checks
        env:
          SECRET_KEY: ci-only-not-secret
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Test suite (offline demo model, no network needed)
        env:
          SECRET_KEY: ci-only-not-secret
        run: python manage.py test tests --noinput -v 2

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t baraza:ci .
      - name: Smoke test
        run: |
          docker run -d --name baraza -p 8000:8000 -e LLM_PROVIDER=fake baraza:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health/ && exit 0; sleep 2; done
          docker logs baraza; exit 1
